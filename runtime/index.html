<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) so the touch controls clear
         the notch / rounded corners; the game owns all gestures (touch-action:none on
         the control surface), so disable the browser's own pinch-zoom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Who Was Remembered</title>
    <!-- Installable / chromeless support. The manifest (display:fullscreen) drives
         Android's installed launch; the apple-* meta tags are the iOS path (Safari
         ignores the manifest's display mode, so Add-to-Home-Screen relies on these
         to launch standalone without browser chrome — the iPhone answer to the
         missing Fullscreen API). theme-color tints the system bars to the storm
         field. Icons are placeholders (public/icon.svg) — replace with final art. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0a0703" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Who Was Remembered" />
    <!-- Spectral: a screen-tuned old-style serif. The piece is a desert of books;
         the type should read like print, not OS chrome. One face throughout (the
         dev perf readout stays monospace); weight + italic carry the hierarchy. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── palette ─────────────────────────────────────────────────────────
         The UI is a museum label laid over a Kuindzhi painting: ink on bone for
         the deliberate panels, bone light for text that floats over the dark
         scene (compass, glance, prompts). One accent, drawn from the world's only
         cool note — the vortex-eye teal — reserved for "the way out": links, the
         travel prompt, the armed reticle, your own bookmarks. Tuned as variables
         so the accent (and the whole temperature) can be re-judged against the
         real scene in seconds. */
      :root {
        --ink: #2c2317; /* primary text on bone */
        --ink-soft: #5c4e38; /* secondary text on bone */
        --bone: #ece2cc; /* the panel "paper" */
        --bone-text: #e9dfc8; /* light text floating over the dark scene */
        --rule: rgba(44, 35, 23, 0.2); /* hairline divisions on bone */
        /* accent follows material temperature. The cool teal earns its keep over
           the cool DARK SCENE (reticle, compass marks, travel keycap); on the WARM
           PAPER card a cool accent reads clinical, so the card uses a warm accent —
           a muted oxblood/sienna, the old-book "red-letter" note that belongs to
           cream paper and harmonises with the desert browns. */
        --accent: #2a8f86; /* teal — scene only, never on the card */
        --accent-bright: #63d2c6; /* teal on the dark scene (reticle, marks) */
        --ink-accent: #9e4a2a; /* warm accent on the bone card (link, bookmarked) */
        --serif: "Spectral", Georgia, "Times New Roman", serif;
        /* --ui-base is the single viewport-responsive HUD type knob. It tracks
           window width (vw) between a phone floor and a large-display ceiling, so
           the floating labels stay proportional to the viewport instead of fixed
           px (which read tiny on a 1440p desktop and oversized on a phone). The
           glance and controls legend derive their sizes from it by ratio, so the
           whole museum-label family scales as one. Tuned: ~10.5px @ 390 (phone),
           ~14.5px @ 1280 (half-width desktop), capped 17px on wide screens. */
        --ui-base: clamp(10px, 8.75px + 0.45vw, 17px);
        /* --engrave is the throughline for ALL floating HUD text: a fine dark
           casing (a ring of 1px shadows forming a continuous outline) plus a soft
           glow. Every chromeless element — compass, glance, status line, travel
           prompt — wears the same treatment, so the HUD reads as one language:
           light engraved into the scene. --case is the casing colour, dialled in
           one place. (The paper card is ink-on-bone and needs none of this.) */
        --case: rgba(10, 7, 3, 0.82);
        --engrave:
          1px 1px 0 var(--case), -1px 1px 0 var(--case), 1px -1px 0 var(--case),
          -1px -1px 0 var(--case), 0 1px 0 var(--case), 0 -1px 0 var(--case),
          1px 0 0 var(--case), -1px 0 0 var(--case), 0 0 8px rgba(0, 0, 0, 0.5);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #d9c9a8;
      }

      /* ── load / error slot (bottom-left) ─────────────────────────────────
         Only shows the loading messages and a load-failure message; cleared to
         empty once the world is up (the old persistent flavour/controls text was
         debug-era and is gone). */
      #info {
        position: fixed;
        left: 14px;
        bottom: 13px;
        font-family: var(--serif);
        font-size: 13px;
        color: var(--bone-text);
        text-shadow: var(--engrave);
        pointer-events: none;
        user-select: none;
      }

      /* ── reticle ─────────────────────────────────────────────────────────
         A faint bone dot at rest; when the look-at picker has an inspectable book
         under it (.armed from JS), the dot warms to the accent and gains a soft
         halo ring — the one affordance the old UI was missing. */
      #reticle {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(233, 223, 200, 0.55);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        user-select: none;
        transition:
          background 0.15s ease,
          box-shadow 0.15s ease;
      }
      #reticle.armed {
        background: var(--accent-bright);
        box-shadow:
          0 0 0 4px rgba(99, 210, 198, 0.18),
          0 0 6px rgba(0, 0, 0, 0.5);
      }

      /* ── shared contextual-action bits ───────────────────────────────────
         The piece must be self-explanatory — no tutorial, eventually touch — so
         every contextual moment spells out its action in ONE component: .act is
         the verb line, .key is a keycap chip. The keycap is neutral (bone outline
         on a dark fill), NOT teal: keycaps are instructional and appear everywhere,
         so colouring them would spend the accent that means "the way out" (links,
         armed reticle, bookmarks). A future touch build swaps the keycap for a
         "tap" wording rather than restyling. Used by the glance and the tp prompt. */
      .act {
        margin-top: 6px;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .key {
        display: inline-block;
        min-width: 1.15em;
        margin: 0 2px;
        padding: 1px 6px;
        border-radius: 3px;
        border: 1px solid rgba(233, 223, 200, 0.5);
        background: rgba(18, 14, 9, 0.5);
        color: var(--bone-text);
        font-weight: 600;
        letter-spacing: 0;
        text-align: center;
        text-transform: none;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6);
      }

      /* ── controls legend (bottom-left) ───────────────────────────────────
         The basic movement controls — the things the contextual prompts don't
         cover. Bright (.show.intro) for the first few seconds of play, then it
         settles to a quiet persistent line (.show); off when neither class is set
         (toggled off in the pause menu). JS owns the class; CSS does the fade.
         Bottom-left, NOT screen centre: the opening vista is the whole point of
         the first 30 seconds, so the hint stays clear of it. Sits above #info,
         which is empty during play. */
      #controls {
        position: fixed;
        left: 14px;
        bottom: 36px;
        /* above the pause scrim (#pause has no z-index, paints later): the legend
           stays bright while paused instead of sitting under the ~0.5 dimmer. It's
           bottom-left, clear of the centred pause card, so no overlap. */
        z-index: 210;
        /* a 2-column grid (key | action) so the action labels left-align no matter
           how wide the keycaps are — desktop keys (WASD/Esc) and the touch gestures
           (Left ½ / Right ½) differ in width, and a per-row flex would ragged them.
           .ctl is display:contents so each row's key+act drop straight into the grid.
           Type props live here and inherit down (contents passes inherited props). */
        display: grid;
        grid-template-columns: max-content max-content;
        column-gap: 10px;
        row-gap: 8px;
        align-items: center;
        font-family: var(--serif);
        font-size: var(--ui-base);
        letter-spacing: 1px;
        text-transform: uppercase;
        line-height: 1;
        color: var(--bone-text);
        text-shadow: var(--engrave);
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
      #controls.show {
        opacity: 0.4;
      }
      #controls.show.intro {
        opacity: 0.95;
      }
      .ctl {
        display: contents;
      }
      .ctl .key {
        justify-self: start;
        min-width: 3.6em;
        margin: 0;
      }
      .ctl .act {
        opacity: 0.85;
      }

      /* ── glance (chromeless wall text) ───────────────────────────────────
         The light, ambient register: name / descriptor / years for the book you
         are looking at. No card, no scrim box — it wears the shared --engrave
         casing (the cartographic label technique: a fine outline keeping it legible
         over any spine colour) so it belongs to the same family as the compass and
         status line rather than reading as its own punchy thing. */
      #glance {
        position: fixed;
        left: 50%;
        top: calc(50% + 28px);
        transform: translateX(-50%);
        max-width: min(90vw, 520px);
        text-align: center;
        color: var(--bone-text);
        font-family: var(--serif);
        text-shadow: var(--engrave);
        pointer-events: none;
        user-select: none;
        display: none;
      }
      #glance .name {
        font-size: calc(var(--ui-base) * 1.95);
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      #glance .desc {
        font-size: calc(var(--ui-base) * 1.27);
        font-style: italic;
        opacity: 0.92;
        margin-top: 3px;
      }
      #glance .years {
        font-size: calc(var(--ui-base) * 1.12);
        opacity: 0.78;
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }

      /* ── inspect / travel panel (the deliberate stop) ────────────────────
         The card is an archival catalogue card: bone paper, ink, a rule under the
         name. No drop shadow (shadows read as floating chrome); a hairline border
         and the deepened scrim seat it. The backdrop captures clicks to close. */
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse at center,
          rgba(16, 12, 7, 0.66),
          rgba(16, 12, 7, 0.46)
        );
      }
      #card {
        min-width: 330px;
        max-width: 440px;
        padding: 26px 30px 22px;
        /* slightly translucent + a faint blur: the deliberate panel is still
           paper, but reads as the same atmospheric light condensed, not an opaque
           sticker dropped on the scene. */
        background: rgba(236, 226, 204, 0.93);
        backdrop-filter: blur(3px);
        border: 1px solid rgba(44, 35, 23, 0.18);
        border-radius: 2px;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 15px;
        line-height: 1.5;
      }
      #card .name {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.2px;
        margin: 0 0 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }
      #card .desc {
        font-style: italic;
        color: var(--ink-soft);
      }
      #card .years {
        color: var(--ink-soft);
        opacity: 0.85;
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }
      /* Wikipedia link as a quiet ruled text link, not a CTA button; the bookmark
         as bare text that takes the accent once set. No web-blue anywhere. */
      #card .actions {
        margin-top: 20px;
        display: flex;
        gap: 22px;
        align-items: baseline;
      }
      #card a {
        color: var(--ink-accent);
        text-decoration: none;
        border-bottom: 1px solid var(--ink-accent);
        padding-bottom: 1px;
        font-weight: 500;
      }
      #card a:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      #card button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        color: var(--ink-soft);
        font: inherit;
        font-weight: 500;
      }
      #card button:hover {
        color: var(--ink);
      }
      #card button.on {
        color: var(--ink-accent);
      }
      #card .hint {
        margin-top: 16px;
        font-size: 11px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--ink-soft);
        opacity: 0.55;
      }

      /* ── compass (the keeper) ────────────────────────────────────────────
         The piece's signature: a horizontal strip of time, anchored on ⊙ (the
         present) not cardinal N/E/S/W. It lives over the dark storm sky, so the
         ink-on-light of the old build read as near-invisible grey — it is bone
         light here, with a shadow halo. Markers slide by bearing relative to
         facing; density-faded near the dense centre (set from JS). */
      #compass {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        /* responsive width: 520px overflows a phone (wider than the viewport, so the
           edge marks fall off-screen). Marks are positioned by JS in %, so the strip
           can shrink freely. min() keeps it phone-safe and caps it on wide screens. */
        width: min(92vw, 560px);
        height: 34px;
        pointer-events: none;
        user-select: none;
        font-family: var(--serif);
        color: var(--bone-text);
        text-shadow: var(--engrave);
      }
      #compass-track {
        position: absolute;
        left: 0;
        right: 0;
        top: 22px;
        height: 1px;
        background: rgba(233, 223, 200, 0.22);
      }
      #compass-notch {
        position: absolute;
        left: 50%;
        top: 14px;
        width: 1px;
        height: 16px;
        margin-left: -0.5px;
        background: rgba(233, 223, 200, 0.65);
      }
      #compass-era {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        font-size: calc(var(--ui-base) * 0.85);
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.85;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .cmark {
        position: absolute;
        top: 13px;
        transform: translateX(-50%);
        font-size: calc(var(--ui-base) * 1.05);
        line-height: 1;
      }
      /* the time axis reads as warm light; your own bookmarks take the cool accent
         so "mine" stands apart from "the world's" — and never the old web-blue. */
      .cmark.origin,
      .cmark.past {
        color: #d9c49d;
      }
      .cmark.bookmark {
        color: var(--accent-bright);
      }
      #compass-label {
        position: absolute;
        left: 50%;
        top: 36px;
        transform: translateX(-50%);
        font-size: calc(var(--ui-base) * 0.92);
        white-space: nowrap;
        text-align: center;
        color: var(--bone-text);
        text-shadow: var(--engrave);
        display: none;
      }

      /* ── travel list (reuses #overlay/#card) ─────────────────────────────
         The 26 anchors as an index: flat rows divided by hairlines, hover lights
         an accent edge. No tan blocks, no blue hover. The seat name stays in
         readable italic (uppercasing a person's name reads wrong). */
      #card .tp-list {
        margin-top: 14px;
        max-height: 54vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      #card .tp-dest {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        padding: 9px 10px;
        text-align: left;
        background: none;
        border: none;
        border-left: 2px solid transparent;
        border-bottom: 1px solid rgba(44, 35, 23, 0.12);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }
      #card .tp-dest:hover {
        background: rgba(44, 35, 23, 0.05);
        border-left-color: var(--ink-accent);
      }
      #card .tp-dest .tp-label {
        font-weight: 600;
        font-size: 15px;
      }
      #card .tp-dest .tp-meta {
        font-style: italic;
        font-size: 12.5px;
        color: var(--ink-soft);
        opacity: 0.85;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      #card .tp-list::-webkit-scrollbar {
        width: 8px;
      }
      #card .tp-list::-webkit-scrollbar-thumb {
        background: rgba(44, 35, 23, 0.25);
        border-radius: 4px;
      }
      #card .tp-list::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ── pause menu (the unlocked state) ─────────────────────────────────
         Releasing the pointer lock surfaces this over the softly-rendering scene.
         The same archival card as #overlay — bone paper, ink, a ruled title — so the
         deliberate panels read as one family. Resume (or a scrim click) re-locks. The
         developer block is gated behind a toggle so a normal viewer never meets the
         dev affordances (fly, flat-lit, perf readout). */
      #pause {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          ellipse at center,
          rgba(16, 12, 7, 0.66),
          rgba(16, 12, 7, 0.46)
        );
      }
      #pause-card {
        min-width: 300px;
        max-width: 360px;
        padding: 26px 30px 24px;
        background: rgba(236, 226, 204, 0.93);
        backdrop-filter: blur(3px);
        border: 1px solid rgba(44, 35, 23, 0.18);
        border-radius: 2px;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 15px;
        line-height: 1.5;
        /* cap to the viewport and scroll internally: with the dev section expanded the card
           runs taller than a phone screen, and the centred flex parent clips the overflow off
           both ends (the dev toggles fell off-screen with no way to reach them). dvh tracks the
           mobile URL bar; vh is the fallback where dvh is unknown. */
        max-height: calc(100vh - 32px);
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #pause-card .pause-title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.2px;
        margin: 0 0 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--rule);
      }
      /* Resume: a quiet ruled text action in the warm card accent, matching the
         Wikipedia link on the inspect card, not a chunky CTA button. */
      #pause-resume {
        background: none;
        border: none;
        padding: 0 0 1px;
        cursor: pointer;
        color: var(--ink-accent);
        border-bottom: 1px solid var(--ink-accent);
        font: inherit;
        font-weight: 500;
      }
      #pause-resume:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      /* readiness spinner: the Esc-exit re-lock cooldown (a fixed ~1.25s Chrome
         constant) makes a Resume click in the first moment a silent no-op. This little
         ring spins through that window so the wait reads as "preparing", not broken.
         Absolutely positioned off the button's right edge, so showing/hiding it never
         reflows the card. Ink-on-bone, no web chrome. */
      .pause-resume-row {
        position: relative;
        display: inline-block;
      }
      #pause-spinner {
        position: absolute;
        left: 100%;
        top: 50%;
        margin: -6px 0 0 10px;
        width: 12px;
        height: 12px;
        border: 2px solid var(--rule);
        border-top-color: var(--ink-soft);
        border-radius: 50%;
        display: none;
        animation: pause-spin 0.7s linear infinite;
      }
      #pause-spinner.show {
        display: block;
      }
      @keyframes pause-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Return to start: a quiet ruled text action in the neutral ink (a rung below
         Resume's warm accent), for a lost player to jump back to the spawn centre. */
      #pause-respawn {
        display: block;
        margin-top: 14px;
        background: none;
        border: none;
        padding: 0 0 1px;
        cursor: pointer;
        color: var(--ink-soft);
        border-bottom: 1px solid var(--rule);
        font: inherit;
      }
      #pause-respawn:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      /* player-facing graphics setting: a quiet segmented choice in the same ruled-text
         language as Resume, not a chunky control. Resolution scales the render pixel
         ratio — the chief mobile/quality lever (the scene is fill-bound, so fewer
         fragments help where geometry culling can't). Active value wears the warm accent. */
      .pause-setting {
        display: flex;
        align-items: baseline;
        margin-top: 16px;
        color: var(--ink);
      }
      /* display:flex above out-specifies the UA [hidden] rule, so a hidden setting
         row would still show — restore the hide for the feature-gated fullscreen row. */
      .pause-setting[hidden] {
        display: none;
      }
      .pause-seg {
        margin-left: auto;
        display: inline-flex;
        gap: 12px;
      }
      /* wind volume: a slim native range, accent-tinted to match the dev checkboxes
         and the active segmented value. Native control, same accent-color convention. */
      .pause-range {
        margin-left: auto;
        width: 120px;
        accent-color: var(--ink-accent);
        cursor: pointer;
      }
      /* padded pills, not bare text: a real >=44px touch target on phones. The active
         one fills with the accent (bone text) so the choice reads at a glance. */
      .pause-seg button {
        min-width: 44px;
        padding: 7px 12px;
        font: inherit;
        cursor: pointer;
        color: var(--ink-soft);
        background: none;
        border: 1px solid var(--rule);
        border-radius: 6px;
      }
      .pause-seg button:hover {
        color: var(--ink);
      }
      .pause-seg button.active {
        color: var(--bone);
        background: var(--ink-accent);
        border-color: var(--ink-accent);
      }
      /* binary settings: a switch + a value word, the whole wrap tappable. align-items
         baseline (the .pause-setting default) reads wrong against a switch, so toggle
         rows centre instead. */
      .pause-setting.toggle-row {
        align-items: center;
      }
      .switch-wrap {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        padding: 4px 0; /* taller hit area without growing the switch visually */
      }
      .switch-val {
        color: var(--ink-soft);
        min-width: 3em;
        text-align: right;
      }
      .switch {
        position: relative;
        width: 46px;
        height: 26px;
        flex: none;
        padding: 0;
        border-radius: 13px;
        border: 1px solid var(--ink-soft);
        background: none;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--ink-soft);
        transform: translateY(-50%);
        transition: transform 0.15s, background-color 0.15s;
      }
      .switch[aria-checked="true"] {
        background: var(--ink-accent);
        border-color: var(--ink-accent);
      }
      .switch[aria-checked="true"]::after {
        transform: translateY(-50%) translateX(20px);
        background: var(--bone);
      }
      /* developer section: a hairline-topped block — the gate, then the gated opts. */
      #pause-dev {
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid var(--rule);
      }
      #dev-opts {
        display: none;
        margin-top: 8px;
        padding-left: 2px;
      }
      .pause-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 5px 0;
        cursor: pointer;
        color: var(--ink);
        user-select: none;
      }
      .pause-toggle input {
        /* tint the native control to the card's warm accent so it belongs to the
           ink-on-bone palette rather than wearing the OS blue. */
        accent-color: var(--ink-accent);
        width: 14px;
        height: 14px;
        cursor: pointer;
      }
      #dev-opts .pause-toggle {
        color: var(--ink-soft);
        font-size: 14px;
      }
      /* dev book-search: a quiet ruled input + a scrolling result list in the same
         ink-on-bone language as the teleport list (.tp-dest). Each row is a Jump
         action (the name) plus a compass bookmark toggle (the star). */
      #dev-find {
        margin-top: 12px;
      }
      #dev-find-input {
        width: 100%;
        box-sizing: border-box;
        background: rgba(44, 35, 23, 0.04);
        border: none;
        border-bottom: 1px solid var(--rule);
        padding: 5px 2px;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
      }
      #dev-find-input::placeholder {
        color: var(--ink-soft);
        opacity: 0.75;
      }
      #dev-find-input:focus {
        outline: none;
        border-bottom-color: var(--ink-accent);
      }
      #dev-find-results {
        margin-top: 4px;
        max-height: 34vh;
        overflow-y: auto;
      }
      .dev-find-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        border-bottom: 1px solid rgba(44, 35, 23, 0.1);
      }
      .dff-go {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 5px 2px;
        text-align: left;
        background: none;
        border: none;
        border-left: 2px solid transparent;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .dff-go:hover {
        background: rgba(44, 35, 23, 0.05);
        border-left-color: var(--ink-accent);
      }
      .dff-go .dfn {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .dff-go .dfy {
        flex: none;
        font-style: italic;
        font-size: 12px;
        color: var(--ink-soft);
      }
      .dff-mark {
        flex: none;
        background: none;
        border: none;
        padding: 2px 4px;
        font: inherit;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        color: var(--ink-soft);
      }
      .dff-mark.on {
        color: var(--ink-accent);
      }
      .dev-find-empty {
        padding: 6px 2px;
        font-style: italic;
        font-size: 13px;
        color: var(--ink-soft);
      }
      /* keycap chip ON the bone card: ink outline, not the bone-on-dark .key wears
         over the scene. Pushed to the row's right edge as a reference, not a button. */
      .pause-toggle .key {
        margin-left: auto;
        border: 1px solid rgba(44, 35, 23, 0.4);
        background: rgba(44, 35, 23, 0.06);
        color: var(--ink-soft);
        text-shadow: none;
        font-size: 11px;
      }

      /* ── touch controls (coarse-pointer devices; shown from JS) ───────────
         Left half drags a floating stick to move, right half drags to look, a tap on an
         armed book inspects. The stick + chips wear the same bone-light-on-dark casing
         as the rest of the floating HUD. touch-action:none so the browser's own pan/zoom
         never fights the controls; the surface sits under the inspect/pause overlays
         (which are display:flex with no z-index, and only ever shown while #touch is
         hidden) and over the canvas. */
      #touch {
        position: fixed;
        inset: 0;
        display: none;
        z-index: 90;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #touch-stick {
        position: absolute;
        width: 112px;
        height: 112px;
        margin: -56px 0 0 -56px; /* centre the base on the touch point set from JS */
        border-radius: 50%;
        border: 1px solid rgba(233, 223, 200, 0.35);
        background: rgba(18, 14, 9, 0.18);
        display: none;
        pointer-events: none;
      }
      #touch-thumb {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        transform: translate(-50%, -50%); /* JS adds the deflection offset */
        background: rgba(233, 223, 200, 0.5);
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
      }
      /* the two chips: bone outline on a dark fill, the .key language scaled up to a
         thumb target. Skate takes the cool accent when engaged (it's a "the way out"-
         adjacent locomotion state, and the accent lives over the dark scene). */
      #touch-skate,
      #touch-pause {
        position: absolute;
        pointer-events: auto;
        font-family: var(--serif);
        color: var(--bone-text);
        text-shadow: var(--engrave);
        background: rgba(18, 14, 9, 0.42);
        border: 1px solid rgba(233, 223, 200, 0.45);
        border-radius: 7px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #touch-skate {
        right: calc(env(safe-area-inset-right, 0px) + 22px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 42px);
        padding: 13px 20px;
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      #touch-skate.on {
        color: var(--accent-bright);
        border-color: var(--accent-bright);
        background: rgba(42, 143, 134, 0.22);
      }
      #touch-pause {
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        right: calc(env(safe-area-inset-right, 0px) + 14px);
        width: 42px;
        height: 42px;
        /* the glyph is DRAWN, not a ⏸ character: the Unicode pause symbol renders
           as the phone's own colour emoji (an orange icon) inside our dark chip,
           clashing with the bone-on-dark HUD. Two CSS bars keep it on-style. */
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      #touch-pause::before,
      #touch-pause::after {
        content: "";
        width: 4px;
        height: 15px;
        border-radius: 1px;
        background: var(--bone-text);
      }

      /* fade-to-black for the jump. Above everything (HUD included) while the
         camera repositions, then fades back. */
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 200;
      }
    </style>
  </head>
  <body>
    <div id="info">loading…</div>
    <div id="reticle"></div>
    <div id="glance"></div>
    <div id="compass">
      <div id="compass-track"></div>
      <div id="compass-notch"></div>
      <div id="compass-era"></div>
      <div id="compass-label"></div>
    </div>
    <div id="controls">
      <div class="ctl"><span class="key">WASD</span><span class="act">Move</span></div>
      <div class="ctl"><span class="key">Shift</span><span class="act">Skate</span></div>
      <div class="ctl"><span class="key">Click</span><span class="act">Look</span></div>
      <div class="ctl"><span class="key">Esc</span><span class="act">Pause</span></div>
    </div>
    <div id="overlay">
      <div id="card"></div>
    </div>
    <div id="pause">
      <div id="pause-card">
        <div class="pause-title">Paused</div>
        <div class="pause-resume-row">
          <button id="pause-resume">Resume</button>
          <span id="pause-spinner" aria-hidden="true"></span>
        </div>
        <button id="pause-respawn">Return to start</button>
        <!-- Ordered by reach, then by kind: the two most-touched controls (Volume,
             Fullscreen) sit up top by the actions; the set-once performance levers and
             the hint toggle drop below; Developer mode stays last behind its gate. -->
        <div class="pause-setting">
          <span>Volume</span>
          <input type="range" id="wind-vol" class="pause-range"
            min="0" max="100" value="60" aria-label="Volume" />
        </div>
        <!-- hidden by JS where the Fullscreen API is absent (iPhone Safari); there the
             chromeless path is Add-to-Home-Screen via the web manifest. The whole
             .switch-wrap is the tap target (value word + switch), big for touch. -->
        <div class="pause-setting toggle-row" id="fullscreen-row" hidden>
          <span>Fullscreen</span>
          <span class="switch-wrap">
            <span class="switch-val" id="fullscreen-val">Off</span>
            <button type="button" class="switch" id="fullscreen-switch"
              role="switch" aria-checked="false" aria-label="Fullscreen"></button>
          </span>
        </div>
        <div class="pause-setting">
          <span>Resolution</span>
          <span class="pause-seg" id="quality-seg">
            <button type="button" data-scale="1">Full</button>
            <button type="button" data-scale="0.75">¾</button>
            <button type="button" data-scale="0.5">½</button>
          </span>
        </div>
        <div class="pause-setting toggle-row">
          <span>Far books</span>
          <span class="switch-wrap">
            <span class="switch-val" id="lod-val">Full</span>
            <button type="button" class="switch" id="lod-switch"
              role="switch" aria-checked="true" aria-label="Far-book detail"></button>
          </span>
        </div>
        <div class="pause-setting toggle-row">
          <span>Controls hint</span>
          <span class="switch-wrap">
            <span class="switch-val" id="legend-val">Shown</span>
            <button type="button" class="switch" id="legend-switch"
              role="switch" aria-checked="true" aria-label="Controls hint"></button>
          </span>
        </div>
        <div id="pause-dev">
          <label class="pause-toggle">
            <input type="checkbox" id="dev-mode" /> Developer mode
          </label>
          <div id="dev-opts">
            <label class="pause-toggle">
              <input type="checkbox" id="dev-fly" /> Fly
              <span class="key">F</span>
            </label>
            <label class="pause-toggle">
              <input type="checkbox" id="dev-flat" /> Flat-lit
              <span class="key">L</span>
            </label>
            <label class="pause-toggle">
              <input type="checkbox" id="dev-perf" /> Performance readout
              <span class="key">`</span>
            </label>
            <label class="pause-toggle">
              <input type="checkbox" id="dev-carpet" checked /> Far dots
              <span class="key">B</span>
            </label>
            <label class="pause-toggle">
              <input type="checkbox" id="dev-books" checked /> Book meshes
              <span class="key">M</span>
            </label>
            <!-- find a book by name: jump to one (its row) or bookmark it on the
                 compass (the ☆). Dev-only; the search index builds on first use. -->
            <div id="dev-find">
              <input
                type="text"
                id="dev-find-input"
                placeholder="Find a book by name…"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
              />
              <div id="dev-find-results"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="fade"></div>
    <!-- touch controls: hidden until main.ts detects a coarse pointer and shows it.
         The stick is positioned under the finger from JS (floating); the two chips are
         the only fixed elements. -->
    <div id="touch">
      <div id="touch-stick"><div id="touch-thumb"></div></div>
      <button id="touch-skate" type="button">Skate</button>
      <button id="touch-pause" type="button" aria-label="Pause"></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
