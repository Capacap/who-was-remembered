<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wikipedia Exploration — walker</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #d9c9a8;
      }
      #info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font: 12px/1.5 system-ui, sans-serif;
        color: #5a4a32;
        pointer-events: none;
        user-select: none;
      }
      /* crosshair: a faint dot marking what the look-at picker is aiming at */
      #reticle {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
        background: rgba(90, 74, 50, 0.55);
        pointer-events: none;
        user-select: none;
      }
      /* glance label: name / description / years for the targeted book. Sits
         just below the reticle, ambient, never interactive. */
      #glance {
        position: fixed;
        left: 50%;
        top: calc(50% + 22px);
        transform: translateX(-50%);
        min-width: 180px;
        max-width: 360px;
        padding: 8px 12px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #4a3c28;
        background: rgba(217, 201, 168, 0.82);
        border-radius: 4px;
        text-align: center;
        pointer-events: none;
        user-select: none;
        display: none;
      }
      #glance .name {
        font-weight: 600;
      }
      #glance .desc {
        opacity: 0.85;
      }
      #glance .years {
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }
      /* inspect overlay: the deliberate stop. Backdrop captures clicks (closes
         + re-locks); the card holds the Wikipedia link. */
      #overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(60, 50, 34, 0.45);
      }
      #card {
        min-width: 320px;
        max-width: 460px;
        padding: 24px 28px;
        background: #e7dcc2;
        border-radius: 8px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        font: 15px/1.5 system-ui, sans-serif;
        color: #3a2f1f;
      }
      #card .name {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      #card .desc {
        opacity: 0.85;
      }
      #card .years {
        opacity: 0.7;
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      #card a {
        display: inline-block;
        margin-top: 18px;
        padding: 9px 16px;
        background: #2f6cff;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
        font-weight: 600;
      }
      #card .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #card a {
        margin-top: 0;
      }
      #card button {
        padding: 9px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background: #cdbd99;
        color: #3a2f1f;
        font: inherit;
        font-weight: 600;
      }
      #card button.on {
        background: #2f6cff;
        color: #fff;
      }
      #card .hint {
        margin-top: 14px;
        font-size: 12px;
        opacity: 0.55;
      }
      /* compass: a horizontal strip anchored on ⊙ (origin = the present), not
         cardinal N/E/S/W. Markers slide by bearing relative to where you face.
         Density-faded near the dense centre (set from JS), present in the void. */
      #compass {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        width: 520px;
        height: 34px;
        pointer-events: none;
        user-select: none;
        font: 14px system-ui, sans-serif;
        color: #4a3c28;
      }
      #compass-track {
        position: absolute;
        left: 0;
        right: 0;
        top: 22px;
        height: 2px;
        background: rgba(90, 74, 50, 0.3);
      }
      #compass-notch {
        position: absolute;
        left: 50%;
        top: 14px;
        width: 2px;
        height: 16px;
        margin-left: -1px;
        background: rgba(90, 74, 50, 0.7);
      }
      #compass-era {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        font-size: 12px;
        opacity: 0.8;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .cmark {
        position: absolute;
        top: 13px;
        transform: translateX(-50%);
        font-size: 16px;
        line-height: 1;
      }
      .cmark.origin {
        color: #7a6038;
      }
      .cmark.past {
        color: #7a6038;
      }
      .cmark.bookmark {
        color: #2f6cff;
      }
      #compass-label {
        position: absolute;
        left: 50%;
        top: 36px;
        transform: translateX(-50%);
        font-size: 13px;
        white-space: nowrap;
        text-align: center;
        color: #3a2f1f;
        background: rgba(217, 201, 168, 0.85);
        padding: 2px 8px;
        border-radius: 4px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="info">loading…</div>
    <div id="reticle"></div>
    <div id="glance"></div>
    <div id="compass">
      <div id="compass-track"></div>
      <div id="compass-notch"></div>
      <div id="compass-era"></div>
      <div id="compass-label"></div>
    </div>
    <div id="overlay">
      <div id="card"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
